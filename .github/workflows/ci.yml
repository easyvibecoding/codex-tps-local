name: Local-only checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate local-only capabilities and scripts
        run: |
          python3 scripts/verify-local-only.py
          zsh -n scripts/build-app.sh scripts/install.sh
          git diff --check
      - name: Preserve accounting behavior
        run: swift test
      - name: Build sandboxed app
        run: ./scripts/build-app.sh
      - name: Run the packaged sandboxed helper
        run: python3 Tests/smoke-snapshot.py 'dist/Codex TPS Local.app' --ci-fixture
